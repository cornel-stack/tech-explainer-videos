name: Render T01 — What Is an API

on:
  # push trigger lets this render without the workflow living on the default
  # branch (workflow_dispatch would require that). Pushing t01-api runs it.
  push:
    branches: [main]
    paths:
      - "t01-api/**"
      - ".github/workflows/t01-render.yml"
  workflow_dispatch:
    inputs:
      script:
        description: "Content JSON (relative to t01-api/)"
        required: true
        default: "content/api.json"

# Parallel pipeline, 1080p60:
#   scenes : Manim diagram clips (manimcommunity image) -> artifact
#   prep   : TTS synth + coco fetch + captions + thumbnail -> bundle artifact
#   render : 6 shards, each a frame range in parallel -> part-N artifacts
#   finish : ffmpeg-concat the parts -> final MP4 -> GitHub Release
env:
  SHARDS: 6
  PROJECT: t01-api
  # workflow_dispatch supplies inputs.script; push events fall back to the default.
  SCRIPT: ${{ github.event.inputs.script || 'content/api.json' }}

jobs:
  scenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Manim scenes (official image)
        run: |
          mkdir -p t01-api/public/manim
          docker run --rm --user root -v "$PWD/t01-api":/work -w /work \
            manimcommunity/manim:stable python pipeline/render_manim.py \
            || echo "::warning::Manim render failed; scenes fall back to native diagrams"
          docker run --rm --user root -v "$PWD/t01-api":/work -w /work \
            manimcommunity/manim:stable python pipeline/render_manim.py --probe \
            || echo "::warning::Manim probe failed"
          touch t01-api/public/manim/keep.txt
      - uses: actions/upload-artifact@v4
        with: { name: scenes, path: t01-api/public/manim, retention-days: 1 }

  prep:
    needs: scenes
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:noble
    defaults:
      run:
        shell: bash
        working-directory: t01-api
    outputs:
      id: ${{ steps.vid.outputs.id }}
      total: ${{ steps.frames.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps
        run: |
          curl -sSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
          python3 /tmp/get-pip.py --break-system-packages
          for a in 1 2 3 4; do
            python3 -m pip install --break-system-packages --no-cache-dir --retries 5 --timeout 60 -r requirements.txt && break
            echo "pip retry $a"; sleep 10
          done
      - uses: actions/cache@v4
        with:
          path: t01-api/node_modules
          key: nm-t01-${{ hashFiles('t01-api/package-lock.json') }}
      - run: npm install --no-audit --no-fund
      - run: npx remotion browser ensure
      - name: Get Manim clips
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: scenes, path: t01-api/public/manim }
      - name: Fetch Coco Material illustrations (best effort)
        continue-on-error: true
        run: python3 pipeline/fetch_coco.py
      - run: python3 pipeline/synth.py "$SCRIPT"
      - run: python3 pipeline/build_outputs.py
      - id: vid
        run: echo "id=$(python3 -c "import json;print(json.load(open('render-input.json'))['id'])")" >> "$GITHUB_OUTPUT"
      - name: Render clickbait thumbnails + build YouTube upload kit
        run: |
          mkdir -p out/youtube
          npx remotion still ThumbA "out/youtube/THUMBNAIL-A.png" --props=render-input.json
          npx remotion still ThumbB "out/youtube/THUMBNAIL-B.png" --props=render-input.json
          cp "out/youtube/THUMBNAIL-A.png" "out/${{ steps.vid.outputs.id }}.png"
          python3 pipeline/build_youtube_kit.py "$SCRIPT"
      - id: frames
        run: echo "total=$(python3 -c "import json;print(json.load(open('render-input.json'))['totalFrames'])")" >> "$GITHUB_OUTPUT"
      - name: Bundle everything the shards need
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          retention-days: 1
          include-hidden-files: true
          path: |
            t01-api/render-input.json
            t01-api/public
            t01-api/out

  render:
    needs: prep
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:noble
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: t01-api
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: t01-api/node_modules
          key: nm-t01-${{ hashFiles('t01-api/package-lock.json') }}
      - run: npm install --no-audit --no-fund
      - run: npx remotion browser ensure
      - uses: actions/download-artifact@v4
        with: { name: bundle, path: t01-api }
      - name: Render frame range for this shard
        run: |
          N=${SHARDS}; total=${{ needs.prep.outputs.total }}; shard=${{ matrix.shard }}
          step=$(( (total + N - 1) / N ))
          start=$(( shard * step )); end=$(( start + step - 1 ))
          if [ "$end" -ge "$total" ]; then end=$(( total - 1 )); fi
          mkdir -p out
          if [ "$start" -gt "$end" ]; then echo "empty shard $shard"; exit 0; fi
          echo "shard $shard: frames $start-$end of $total"
          npx remotion render Video "out/part-$(printf '%02d' $shard).mp4" \
            --props=render-input.json --frames=$start-$end --concurrency=100% --gl=swangle
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: t01-api/out/part-*.mp4
          retention-days: 1
          if-no-files-found: ignore

  finish:
    needs: [prep, render]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Get the bundle (thumbnail, captions, description)
        uses: actions/download-artifact@v4
        with: { name: bundle, path: t01-api }
      - name: Get all rendered parts
        uses: actions/download-artifact@v4
        with: { pattern: part-*, path: t01-api/parts, merge-multiple: true }
      - name: Concatenate parts -> final MP4
        run: |
          cd t01-api
          id=${{ needs.prep.outputs.id }}
          : > /tmp/list.txt
          for f in $(ls parts/part-*.mp4 | sort -V); do echo "file '$PWD/$f'" >> /tmp/list.txt; done
          echo "parts:"; cat /tmp/list.txt
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i /tmp/list.txt -c copy "out/$id.mp4"
          ls -la "out/$id.mp4"
      - name: Zip the YouTube upload kit (labelled folder)
        run: |
          cd t01-api/out
          zip -r "${{ needs.prep.outputs.id }}-youtube-kit.zip" youtube
          ls -la youtube
      - name: Publish as Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: t01-api-${{ github.run_number }}
          name: "What Is an API? — build ${{ github.run_number }}"
          body: |
            Automated 1080p60 render of `t01-api/${{ env.SCRIPT }}`.
            Open Peeps + DiceBear + Coco Material + Manim + three.js, composited with Remotion.
          files: |
            t01-api/out/${{ needs.prep.outputs.id }}.mp4
            t01-api/out/${{ needs.prep.outputs.id }}.png
            t01-api/out/${{ needs.prep.outputs.id }}-youtube-kit.zip
            t01-api/out/youtube/THUMBNAIL-A.png
            t01-api/out/youtube/THUMBNAIL-B.png
            t01-api/out/captions.srt
            t01-api/out/chapters.txt
            t01-api/out/description.txt
      - run: |
          echo "### Render complete :clapper:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/tag/t01-api-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
