name: Render T28 — How a CPU Works

on:
  push:
    branches: [main, t28-cpu]
    paths:
      - "t28-cpu/**"
      - ".github/workflows/t28-render.yml"
  workflow_dispatch:
    inputs:
      script:
        description: "Content JSON (relative to t28-cpu/)"
        required: true
        default: "content/cpu.json"

env:
  SHARDS: 8
  PROJECT: t28-cpu
  SCRIPT: ${{ github.event.inputs.script || 'content/cpu.json' }}

jobs:
  scenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Manim scenes (official image)
        run: |
          mkdir -p t28-cpu/public/manim
          docker run --rm --user root -v "$PWD/t28-cpu":/work -w /work \
            manimcommunity/manim:stable python pipeline/render_manim.py \
            || echo "::warning::Manim render failed; some scenes fall back"
          touch t28-cpu/public/manim/keep.txt
      - name: Measure Manim clip durations (host ffprobe — reliable)
        run: |
          which ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          sudo chown -R "$(id -u):$(id -g)" t28-cpu/public/manim
          cd t28-cpu/public/manim
          python3 - <<'PY'
          import json, glob, os, subprocess
          out = {}
          for f in sorted(glob.glob("*.mp4")):
              name = os.path.splitext(f)[0]
              try:
                  d = subprocess.check_output(
                      ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                       "-of", "default=noprint_wrappers=1:nokey=1", f], text=True).strip()
                  out[name] = round(float(d), 3)
              except Exception as e:
                  print("warn", f, e)
          json.dump(out, open("durations.json", "w"), indent=2)
          print("durations.json ->", out)
          PY
      - uses: actions/upload-artifact@v4
        with: { name: scenes, path: t28-cpu/public/manim, retention-days: 1 }

  prep:
    needs: scenes
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:noble
    defaults:
      run:
        shell: bash
        working-directory: t28-cpu
    outputs:
      id: ${{ steps.vid.outputs.id }}
      total: ${{ steps.frames.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps
        run: |
          curl -sSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
          python3 /tmp/get-pip.py --break-system-packages
          for a in 1 2 3 4; do
            python3 -m pip install --break-system-packages --no-cache-dir --retries 5 --timeout 60 -r requirements.txt && break
            echo "pip retry $a"; sleep 10
          done
      - uses: actions/cache@v4
        with:
          path: t28-cpu/node_modules
          key: nm-t28-${{ hashFiles('t28-cpu/package-lock.json') }}
      - run: npm install --no-audit --no-fund
      - run: npx remotion browser ensure
      - name: Get Manim clips
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: scenes, path: t28-cpu/public/manim }
      - run: python3 pipeline/synth.py "$SCRIPT"
      - run: python3 pipeline/build_outputs.py
      - id: vid
        run: echo "id=$(python3 -c "import json;print(json.load(open('render-input.json'))['id'])")" >> "$GITHUB_OUTPUT"
      - name: Render clickbait thumbnails + build YouTube upload kit
        run: |
          mkdir -p out/youtube
          npx remotion still ThumbA "out/youtube/THUMBNAIL-A.png" --props=render-input.json
          npx remotion still ThumbB "out/youtube/THUMBNAIL-B.png" --props=render-input.json
          cp "out/youtube/THUMBNAIL-A.png" "out/${{ steps.vid.outputs.id }}.png"
          python3 pipeline/build_youtube_kit.py "$SCRIPT"
      - id: frames
        run: echo "total=$(python3 -c "import json;print(json.load(open('render-input.json'))['totalFrames'])")" >> "$GITHUB_OUTPUT"
      - name: Bundle everything the shards need
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          retention-days: 1
          include-hidden-files: true
          path: |
            t28-cpu/render-input.json
            t28-cpu/public
            t28-cpu/out

  render:
    needs: prep
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:noble
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: t28-cpu
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: t28-cpu/node_modules
          key: nm-t28-${{ hashFiles('t28-cpu/package-lock.json') }}
      - run: npm install --no-audit --no-fund
      - run: npx remotion browser ensure
      - uses: actions/download-artifact@v4
        with: { name: bundle, path: t28-cpu }
      - name: Render frame range for this shard
        run: |
          N=${SHARDS}; total=${{ needs.prep.outputs.total }}; shard=${{ matrix.shard }}
          step=$(( (total + N - 1) / N ))
          start=$(( shard * step )); end=$(( start + step - 1 ))
          if [ "$end" -ge "$total" ]; then end=$(( total - 1 )); fi
          mkdir -p out
          if [ "$start" -gt "$end" ]; then echo "empty shard $shard"; exit 0; fi
          echo "shard $shard: frames $start-$end of $total"
          npx remotion render Video "out/part-$(printf '%02d' $shard).mp4" \
            --props=render-input.json --frames=$start-$end --concurrency=100% --gl=swangle
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: t28-cpu/out/part-*.mp4
          retention-days: 1
          if-no-files-found: ignore

  finish:
    needs: [prep, render]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ensure ffmpeg (apt — reliable, no flaky download action)
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Get the bundle
        uses: actions/download-artifact@v4
        with: { name: bundle, path: t28-cpu }
      - name: Get all rendered parts
        uses: actions/download-artifact@v4
        with: { pattern: part-*, path: t28-cpu/parts, merge-multiple: true }
      - name: Concatenate parts -> final MP4
        run: |
          cd t28-cpu
          id=${{ needs.prep.outputs.id }}
          : > /tmp/list.txt
          for f in $(ls parts/part-*.mp4 | sort -V); do echo "file '$PWD/$f'" >> /tmp/list.txt; done
          echo "parts:"; cat /tmp/list.txt
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i /tmp/list.txt -c copy "out/$id.mp4"
          ls -la "out/$id.mp4"
      - name: Zip the YouTube upload kit (labelled folder)
        run: |
          cd t28-cpu/out
          zip -r "${{ needs.prep.outputs.id }}-youtube-kit.zip" youtube
          ls -la youtube
      - name: Publish as Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: t28-cpu-${{ github.run_number }}
          name: "How a CPU Works — build ${{ github.run_number }}"
          body: |
            Automated 1080p60 render of `t28-cpu/${{ env.SCRIPT }}`.
            A "How It Works" explainer across 7 stages building a CPU from the
            ground up: the transistor switch, logic gates, binary & the von Neumann
            model, the clock, the fetch-decode-execute loop, registers + ALU, and
            cache + pipelines + cores. A 3D CPU-die hero (three.js) + 7 Manim scenes
            — no logos. Sourced (Patterson & Hennessy; digital logic refs).
          files: |
            t28-cpu/out/${{ needs.prep.outputs.id }}.mp4
            t28-cpu/out/${{ needs.prep.outputs.id }}.png
            t28-cpu/out/${{ needs.prep.outputs.id }}-youtube-kit.zip
            t28-cpu/out/youtube/THUMBNAIL-A.png
            t28-cpu/out/youtube/THUMBNAIL-B.png
            t28-cpu/out/captions.srt
            t28-cpu/out/chapters.txt
            t28-cpu/out/description.txt
      - run: |
          echo "### Render complete :clapper:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/tag/t28-cpu-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
